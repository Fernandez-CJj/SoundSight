name: Deploy SoundSight landing page

on:
  push:
    branches: [master]
    paths:
      - 'landing-page/**'
      - '.github/workflows/deploy-landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
        with:
          sparse-checkout: landing-page

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload landing page only
        uses: actions/upload-pages-artifact@v5
        with:
          path: landing-page

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
